<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tanani</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Respaldo art déco por si el archivo de Volstead no está subido -->
<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<style>
  /* Coloca tu archivo de la tipografía en la carpeta /fonts con uno de estos nombres */
  @font-face{
    font-family:'Volstead';
    src:local('Volstead'),
        url('fonts/Volstead.woff2') format('woff2'),
        url('fonts/Volstead.woff') format('woff'),
        url('fonts/Volstead.otf') format('opentype'),
        url('fonts/Volstead.ttf') format('truetype');
    font-display:swap;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  #wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center}
  canvas{flex:1;width:100%;min-height:0;display:block;cursor:pointer}
  #start{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:5;cursor:pointer;transition:opacity 1.2s ease}
  #start.hide{opacity:0;pointer-events:none}
  #start span{font-family:'Volstead','Limelight',serif;color:#ffc4e4;font-size:clamp(22px,5vw,34px);letter-spacing:.12em;animation:pulse 2.2s ease-in-out infinite;text-shadow:0 0 14px rgba(255,150,215,.5)}
  @keyframes pulse{50%{opacity:.3}}
  #mute{position:fixed;top:14px;right:16px;z-index:4;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,196,228,.4);background:rgba(0,0,0,.4);color:#ffc4e4;font-size:18px;cursor:pointer;opacity:.7;transition:opacity .3s}
  #mute:hover{opacity:1}
  #mute.off{opacity:.35;text-decoration:line-through}
</style>
</head>
<body>
<div id="start"><span>Toca para abrir</span></div>
<button id="mute" aria-label="Activar o silenciar la música">♪</button>
<div id="yt" style="position:fixed;left:-9999px;top:0;width:220px;height:220px"></div>
<audio id="bgm" src="music/cancion.mp3" loop preload="auto"></audio>
<div id="wrap">
  <canvas id="c" role="img" aria-label="Ramo de orquídeas animado con el nombre Tanani"></canvas>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  let ctx = cv.getContext('2d');
  const mainCtx = ctx;

  /* ---------- utilidades ---------- */
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeIO = x => -(Math.cos(Math.PI * x) - 1) / 2;
  const easeBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const rad = d => d * Math.PI / 180;
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* ---------- lienzo ---------- */
  let W = 0, H = 0, S = 1, ox = 0, oy = 0, dpr = 1;
  /* --- ASCII: la escena se dibuja en un lienzo oculto y se traduce a caracteres --- */
  let OK = 0.6, OW = 480, OH = 648;
  const off = document.createElement('canvas'); off.width = OW; off.height = OH;
  const oc = off.getContext('2d', { willReadFrequently: true });
  const asciiCv = document.createElement('canvas');
  const ac = asciiCv.getContext('2d');
  let CW = 7, CH = 10, FS = 11, fn = 0, skip = 2;
  const glyphCache = new Map();
  const RAMP = '.,:;-~=+*o#%@&';
  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, r.width < 600 ? 1.5 : 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    S = Math.min(W / 800, H / 1080);
    ox = (W - 800 * S) / 2;
    oy = (H - 1080 * S) / 2;
    asciiCv.width = cv.width; asciiCv.height = cv.height;
    const small = W < 600;
    OK = small ? 0.42 : 0.6; OW = Math.round(800 * OK); OH = Math.round(1080 * OK);
    off.width = OW; off.height = OH;
    glyphCache.clear();
    CW = small ? 8 : 6; CH = small ? 11 : 8; FS = small ? 12 : 9.5;
  }
  window.addEventListener('resize', resize);

  /* textura de grano (efecto "tejido" de los pétalos) */
  const grain = document.createElement('canvas');
  grain.width = grain.height = 96;
  (() => {
    const g = grain.getContext('2d');
    const img = g.createImageData(96, 96);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() < 0.5 ? 0 : 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = Math.random() * 90;
    }
    g.putImageData(img, 0, 0);
  })();
  const grainPat = ctx.createPattern(grain, 'repeat');

  /* ---------- paletas de orquídeas ---------- */
  const PAL = [
    { in: '#fffafc', out: '#f6a9cb', lip: '#d6338a', spot: '#8a0f55', col: '#fff3b0' },
    { in: '#ffd3ee', out: '#b8157f', lip: '#ffd14d', spot: '#c4521a', col: '#fff3b0' },
    { in: '#efdcff', out: '#7a2cc0', lip: '#ffcf40', spot: '#6a1f9a', col: '#ffffff' },
    { in: '#ffe6f1', out: '#ea5a9c', lip: '#a3126a', spot: '#4e0a35', col: '#ffffff' },
    { in: '#ffffff', out: '#f4e08a', lip: '#e9a216', spot: '#c0281c', col: '#fff9d0' },
    { in: '#fff4a8', out: '#dfa019', lip: '#b3261e', spot: '#5c0e0a', col: '#ffffff' },
    { in: '#ffa392', out: '#a80f20', lip: '#ffd24a', spot: '#6d0a14', col: '#fff3b0' },
    { in: '#f8f1ff', out: '#a68ae0', lip: '#7a3fb8', spot: '#3b1a66', col: '#ffffff' },
  ];

  /* ---------- ramo: posición de cada orquídea ---------- */
  const BASE = { x: 400, y: 800 };
  const FL = [
    { x: 366, y: 190, s: 1.12, p: 0 },
    { x: 232, y: 322, s: 0.92, p: 1 },
    { x: 566, y: 258, s: 0.88, p: 2 },
    { x: 322, y: 446, s: 1.02, p: 3 },
    { x: 492, y: 378, s: 1.06, p: 4 },
    { x: 158, y: 498, s: 0.78, p: 5 },
    { x: 648, y: 436, s: 0.82, p: 6 },
    { x: 418, y: 548, s: 0.9, p: 7 },
    { x: 272, y: 606, s: 0.7, p: 3 },
    { x: 590, y: 574, s: 0.66, p: 0 },
  ];
  FL.forEach((f, i) => {
    f.i = i; f.ph = rnd(0, 6.28); f.rotJ = rnd(-0.32, 0.32);
    f.bx = BASE.x + rnd(-16, 16);
    f.cb = rnd(-46, 46);              /* curvatura propia del tallo */
    f.sw = rnd(4, 6);                 /* grosor del tallo */
    f.sx = rnd(0.92, 1.06);           /* la flor se ve un poco girada */
    f.tilt = rnd(0.78, 1.0);
    f.j = Array.from({ length: 6 }, () => ({ da: rnd(-10, 10), l: rnd(0.86, 1.12), w: rnd(0.86, 1.14), sk: rnd(-0.16, 0.16) }));
    f.buds = Array.from({ length: Math.random() < 0.7 ? (Math.random() < 0.5 ? 1 : 2) : 0 }, (_, k) => ({ u: rnd(0.55, 0.86) - k * 0.12, side: Math.random() < 0.5 ? -1 : 1, sz: rnd(0.26, 0.4) }));
    f.bud = { sx: 1, tilt: 0.95, j: Array.from({ length: 6 }, () => ({ da: rnd(-6, 6), l: 1, w: 1, sk: rnd(-0.1, 0.1) })) };
  });
  const drawOrder = FL.slice().sort((a, b) => a.y - b.y);

  /* hojas: cada una nace con su propio ángulo, largo, ancho y curva */
  const LEAF_TONES = [
    ['#0f3f1c', '#1f7a38', '#58b868'],
    ['#0c3a24', '#17693f', '#3fa06a'],
    ['#1a4a16', '#3b8a2c', '#7cc64a'],
  ];
  const LEAVES = Array.from({ length: 11 }, () => {
    const a = rnd(-98, 98);
    const out = a < 0 ? -1 : 1;
    return {
      a, L: rnd(150, 345) * (Math.abs(a) > 80 ? 0.7 : 1),
      w1: rnd(22, 44), w2: rnd(22, 44), b: out * rnd(-20, 75),
      d: rnd(0.8, 2.4), ph: rnd(0, 6.28),
      x: BASE.x + rnd(-18, 18), y: BASE.y + rnd(-6, 14),
      tone: Math.floor(rnd(0, 3)), back: Math.random() < 0.4,
    };
  });

  /* estrellas y partículas */
  const STARS = Array.from({ length: 110 }, () => ({ x: Math.random(), y: Math.random(), r: rnd(0.4, 1.5), ph: rnd(0, 6.28), sp: rnd(0.6, 2.2) }));
  const MOTES = Array.from({ length: 34 }, () => ({ x: Math.random(), y: Math.random(), r: rnd(0.8, 2.6), v: rnd(0.012, 0.035), ph: rnd(0, 6.28), hue: rnd(300, 345) }));

  /* ---------- dibujo de pétalos ---------- */
  function petalPath(L, Wd) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-Wd * 0.55, -L * 0.12, -Wd * 1.0, -L * 0.62, -Wd * 0.35, -L * 0.93);
    ctx.quadraticCurveTo(0, -L * 1.08, Wd * 0.35, -L * 0.93);
    ctx.bezierCurveTo(Wd * 1.0, -L * 0.62, Wd * 0.55, -L * 0.12, 0, 0);
    ctx.closePath();
  }

  function petal(ang, L, Wd, c1, c2, e, open, sk) {
    if (e <= 0.01) return;
    ctx.save();
    ctx.rotate(rad(ang * (0.12 + 0.88 * clamp(open, 0, 1.15))));
    ctx.scale(e, e);
    ctx.transform(1, 0, sk || 0, 1, 0, 0);
    petalPath(L, Wd);
    const g = ctx.createLinearGradient(0, 0, 0, -L);
    g.addColorStop(0, c1);
    g.addColorStop(0.55, c1);
    g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.globalAlpha = 0.3; ctx.strokeStyle = c2; ctx.lineWidth = 4; ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function orchid(x, y, size, rot, pal, bloom, t, f) {
    const P = PAL[pal];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(size * f.sx, size * f.tilt);

    /* resplandor suave */
    const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 120);
    glow.addColorStop(0, P.out + '40');
    glow.addColorStop(1, P.out + '00');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, 120, 0, 6.2832); ctx.fill();

    const E = i => easeBack(clamp((bloom - i * 0.07) / 0.55));
    const O = i => easeOut(clamp((bloom - 0.05 - i * 0.07) / 0.7));
    const J = f.j;
    const pt = (i, ang, L, Wd) => petal(ang + J[i].da, L * J[i].l, Wd * J[i].w, P.in, P.out, E(i), O(i), J[i].sk);
    pt(0, -148, 88, 40);   /* sépalo inf. izq. */
    pt(1, 148, 88, 40);    /* sépalo inf. der. */
    pt(2, 0, 94, 44);      /* sépalo superior */
    pt(3, -80, 94, 64);    /* pétalo grande izq. */
    pt(4, 80, 94, 64);     /* pétalo grande der. */

    /* labelo */
    const eL = E(5);
    if (eL > 0.01) {
      ctx.save();
      ctx.rotate(rad((180 + J[5].da) * (0.12 + 0.88 * clamp(O(5), 0, 1.1))));
      ctx.scale(eL, eL);
      petalPath(52, 27);
      const lg = ctx.createLinearGradient(0, 0, 0, -52);
      lg.addColorStop(0, P.spot); lg.addColorStop(0.35, P.lip); lg.addColorStop(1, P.lip);
      ctx.fillStyle = lg; ctx.fill();
      ctx.restore();
    }
    /* columna y puntitos */
    const eC = clamp((bloom - 0.35) / 0.4);
    if (eC > 0) {
      ctx.save(); ctx.scale(eC, eC);
      ctx.fillStyle = P.spot;
      for (let k = 0; k < 7; k++) {
        const a = k * 2.4 + 1; const r = 8 + (k % 3) * 5;
        ctx.globalAlpha = 0.55;
        ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.9, 12 + Math.sin(a) * r * 0.5, 1.5, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
      const cg = ctx.createRadialGradient(-2, -3, 1, 0, 0, 10);
      cg.addColorStop(0, '#ffffff'); cg.addColorStop(1, P.col);
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.ellipse(0, -2, 8, 10, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(120,60,0,.55)';
      ctx.beginPath(); ctx.arc(0, 1, 2.6, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  /* ---------- tallos, hojas, lazo ---------- */
  const qb = (a, c, b, u) => {
    const v = 1 - u;
    return { x: v * v * a.x + 2 * v * u * c.x + u * u * b.x, y: v * v * a.y + 2 * v * u * c.y + u * u * b.y };
  };

  function leaf(l, t, swayAmt) {
    const g = easeOut(clamp((t - l.d) / 2.8));
    if (g <= 0) return;
    const sw = Math.sin(t * 0.7 + l.ph) * swayAmt;
    const L = l.L, b = l.b + sw * 6;
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(rad(l.a) + sw * 0.035);
    ctx.scale(g, g);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-l.w1, -L * 0.25, -l.w1 * 0.8 + b * 0.6, -L * 0.72, b, -L);
    ctx.bezierCurveTo(l.w2 * 0.8 + b * 0.6, -L * 0.72, l.w2, -L * 0.25, 0, 0);
    ctx.closePath();
    const c = LEAF_TONES[l.tone];
    const gr = ctx.createLinearGradient(0, 0, b, -L);
    gr.addColorStop(0, c[0]); gr.addColorStop(0.5, c[1]); gr.addColorStop(1, c[2]);
    ctx.fillStyle = gr; ctx.fill();
    ctx.globalAlpha = 0.3; ctx.strokeStyle = c[2]; ctx.lineWidth = 3; ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(200,255,205,.3)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo((l.w2 - l.w1) / 2, -L * 0.25, (l.w2 - l.w1) * 0.4 + b * 0.6, -L * 0.72, b, -L);
    ctx.stroke();
    ctx.restore();
  }

  function ribbon(g) {
    if (g <= 0) return;
    ctx.save();
    ctx.translate(BASE.x, BASE.y - 12);
    ctx.scale(g, g);
    const grad = ctx.createLinearGradient(-50, -20, 50, 60);
    grad.addColorStop(0, '#ffd0e6'); grad.addColorStop(1, '#c43b8c');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(0, 6, 34, 13, 0, 0, 6.2832); ctx.fill();
    for (const m of [1, -1]) {
      ctx.save(); ctx.scale(m, 1);
      ctx.beginPath();
      ctx.moveTo(-2, 4); ctx.quadraticCurveTo(-26, 46, -52, 100);
      ctx.lineTo(-34, 92); ctx.lineTo(-30, 108);
      ctx.quadraticCurveTo(-10, 54, 6, 8); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.bezierCurveTo(-32, -38, -70, -20, -58, 8);
      ctx.bezierCurveTo(-52, 28, -24, 20, 0, 5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#e2589f';
    ctx.beginPath(); ctx.ellipse(0, 3, 11, 10, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  /* ---------- escena -> ASCII ---------- */
  function drawScene(t) {
    ctx = oc;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, OW, OH);
    ctx.setTransform(OK, 0, 0, OK, 0, 0);
    const swayAmt = easeIO(clamp((t - 5) / 3));
    const sw0 = Math.sin(t * 0.8);

    /* posiciones y tallos */
    const geo = FL.map((f, i) => {
      const st = 0.3 + i * 0.26, dur = 1.9;
      const sp = easeIO(clamp((t - st) / dur));
      const sx = swayAmt * Math.sin(t * 0.9 + f.ph) * 7;
      const H_ = { x: f.x + sx, y: f.y + swayAmt * Math.cos(t * 0.7 + f.ph) * 2 };
      const B_ = { x: f.bx, y: BASE.y };
      const C_ = { x: B_.x + (H_.x - B_.x) * 0.12 + sx * 0.3 + f.cb, y: B_.y + (H_.y - B_.y) * 0.62 };
      return { f, st, dur, sp, H_, B_, C_ };
    });

    LEAVES.filter(l => l.back).forEach(l => leaf(l, t, swayAmt));
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const g of geo) {
      if (g.sp <= 0.001) continue;
      const n = Math.max(3, Math.ceil(50 * g.sp));
      ctx.beginPath();
      for (let k = 0; k <= n; k++) {
        const p = qb(g.B_, g.C_, g.H_, (k / n) * g.sp);
        k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
      }
      ctx.strokeStyle = '#1d6a30'; ctx.lineWidth = g.f.sw; ctx.stroke();
      ctx.strokeStyle = 'rgba(150,235,160,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    /* hojas */
    LEAVES.filter(l => !l.back).forEach(l => leaf(l, t, swayAmt));

    /* lazo */
    ribbon(easeBack(clamp((t - 4.2) / 1.1)));

    /* flores (las de arriba quedan detrás) */
    for (const f of drawOrder) {
      const g = geo[f.i];
      if (g.sp <= 0.04) continue;
      const tip = qb(g.B_, g.C_, g.H_, g.sp);
      const u = g.sp;
      const dx = 2 * (1 - u) * (g.C_.x - g.B_.x) + 2 * u * (g.H_.x - g.C_.x);
      const dy = 2 * (1 - u) * (g.C_.y - g.B_.y) + 2 * u * (g.H_.y - g.C_.y);
      const rot = Math.atan2(dx, -dy) * 0.75 + f.rotJ + swayAmt * Math.sin(t * 0.9 + f.ph) * 0.035;
      const bloom = clamp((t - (g.st + g.dur * 0.8)) / 2.6);
      const size = 0.9 * f.s * (0.3 + 0.7 * easeOut(bloom)) * easeOut(clamp(g.sp * 1.4));
      for (const bd of f.buds) {
        if (g.sp <= bd.u) continue;
        const bp = qb(g.B_, g.C_, g.H_, bd.u);
        const bb = clamp((t - (g.st + g.dur * bd.u + 0.6)) / 3.2);
        if (bb <= 0) continue;
        const off = bd.side * 16 * (0.5 + 0.5 * bb);
        ctx.strokeStyle = '#1d6a30'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(bp.x, bp.y); ctx.quadraticCurveTo(bp.x + off * 0.4, bp.y - 3, bp.x + off, bp.y - 8); ctx.stroke();
        orchid(bp.x + off, bp.y - 8, 0.9 * f.s * bd.sz * (0.5 + 0.5 * easeOut(bb)), bd.side * 0.5, f.p, 0.1 + 0.22 * bb, t, f.bud);
      }
      orchid(tip.x, tip.y, size, rot, f.p, bloom, t, f);
    }

    drawName(t);
    ctx = mainCtx;
  }

  /* ---------- nombre: se dibuja con la tipografía y se vuelve ASCII ---------- */
  const NAME = 'Tanani', NAME_SIZE = 150, NAME_Y = 1000, NAME_START = 5.6;
  const NAME_FONT = NAME_SIZE + 'px "Volstead","Limelight",serif';
  ['Volstead', 'Limelight'].forEach(f => { try { document.fonts.load(NAME_SIZE + 'px "' + f + '"').catch(() => {}); } catch (e) {} });
  function drawName(t) {
    ctx.font = NAME_FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const gap = NAME_SIZE * 0.07;
    const w = [...NAME].map(ch => ctx.measureText(ch).width);
    const total = w.reduce((a, b) => a + b, 0) + gap * (NAME.length - 1);
    let x = 400 - total / 2;
    const grad = ctx.createLinearGradient(0, NAME_Y - NAME_SIZE / 2, 0, NAME_Y + NAME_SIZE / 2);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#ffb9e0');
    for (let i = 0; i < NAME.length; i++) {
      const a = easeOut(clamp((t - NAME_START - i * 0.22) / 1.3));
      if (a > 0) {
        ctx.globalAlpha = a;
        ctx.fillStyle = grad; ctx.strokeStyle = grad; ctx.lineWidth = 3; ctx.lineJoin = 'round';
        const y = NAME_Y + (1 - a) * 18;
        ctx.fillText(NAME[i], x, y);
        ctx.strokeText(NAME[i], x, y);
      }
      x += w[i] + gap;
    }
    ctx.globalAlpha = 1;
  }

  function glyph(idx, qr, qg, qb) {
    const key = idx * 512 + qr * 64 + qg * 8 + qb;
    let g = glyphCache.get(key);
    if (!g) {
      const w = Math.ceil(CW * S * dpr) + 2, h = Math.ceil(CH * S * dpr) + 2;
      g = document.createElement('canvas'); g.width = w; g.height = h;
      const c = g.getContext('2d');
      c.font = 'bold ' + (FS * S * dpr) + 'px ui-monospace,Menlo,Consolas,"Courier New",monospace';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = 'rgb(' + Math.round(qr * 255 / 7) + ',' + Math.round(qg * 255 / 7) + ',' + Math.round(qb * 255 / 7) + ')';
      c.fillText(RAMP[idx], w / 2, h / 2);
      glyphCache.set(key, g);
    }
    return g;
  }

  function renderAscii(t) {
    drawScene(t);
    const d = oc.getImageData(0, 0, OW, OH).data;
    ac.setTransform(1, 0, 0, 1, 0, 0);
    ac.clearRect(0, 0, asciiCv.width, asciiCv.height);
    const cols = Math.floor(800 / CW), rows = Math.floor(1080 / CH);
    const cwp = CW * S * dpr, chp = CH * S * dpr, offx = ox * dpr, offy = oy * dpr;
    for (let r = 0; r < rows; r++) {
      const y0 = Math.floor(r * CH * OK), y1 = Math.min(OH, Math.ceil((r + 1) * CH * OK));
      for (let c = 0; c < cols; c++) {
        const x0 = Math.floor(c * CW * OK), x1 = Math.min(OW, Math.ceil((c + 1) * CW * OK));
        let R = 0, G = 0, B = 0, n = 0;
        for (let y = y0; y < y1; y++) {
          let i = (y * OW + x0) * 4;
          for (let x = x0; x < x1; x++, i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; n++; }
        }
        if (!n) continue;
        R /= n; G /= n; B /= n;
        const lum = (0.299 * R + 0.587 * G + 0.114 * B) / 255;
        if (lum < 0.06) continue;
        const idx = Math.min(RAMP.length - 1, Math.floor(Math.pow(lum, 0.75) * RAMP.length));
        const m = Math.max(R, G, B) || 1, f = Math.min(1.55, 255 / m) / 255 * 7;
        const g = glyph(idx, Math.min(7, Math.round(R * f)), Math.min(7, Math.round(G * f)), Math.min(7, Math.round(B * f)));
        ac.drawImage(g, Math.round(offx + (c + 0.5) * cwp - g.width / 2), Math.round(offy + (r + 0.5) * chp - g.height / 2));
      }
    }
  }

  /* ---------- bucle principal ---------- */
  let t0 = performance.now(), started = false;
  const startEl = document.getElementById('start');
  const bgm = document.getElementById('bgm');
  const muteBtn = document.getElementById('mute');
  /* ===== MÚSICA =====
     Pega aquí el ID del video de YouTube (lo que va después de v= en el enlace).
     Ejemplo: https://www.youtube.com/watch?v=ABC123xyz  ->  'ABC123xyz'
     Si lo dejas vacío, se usa el archivo music/cancion.mp3 */
  const YT_ID = '66A_3uwuZ_I';

  let fadeTimer = null, musicOn = false, yt = null, ytReady = false, vol = 0;
  function setVol(v) {
    vol = v;
    if (YT_ID) { if (ytReady) yt.setVolume(Math.round(v * 100)); }
    else bgm.volume = v;
  }
  function fadeIn() {
    clearInterval(fadeTimer);
    setVol(0);
    fadeTimer = setInterval(() => {
      setVol(Math.min(0.8, vol + 0.04));
      if (vol >= 0.8) clearInterval(fadeTimer);
    }, 150);
  }
  function playMusic() {
    musicOn = true;
    if (YT_ID) { if (ytReady) { yt.playVideo(); fadeIn(); } }   /* si aún no carga, onReady lo inicia */
    else { const pr = bgm.play(); if (pr && pr.catch) pr.catch(() => {}); fadeIn(); }
  }
  function pauseMusic() {
    musicOn = false;
    clearInterval(fadeTimer);
    if (YT_ID) { if (ytReady) yt.pauseVideo(); } else bgm.pause();
  }
  if (YT_ID) {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('yt', {
        videoId: YT_ID,
        playerVars: { playsinline: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => { ytReady = true; if (musicOn) { yt.playVideo(); fadeIn(); } },
          onStateChange: e => { if (e.data === 0) { yt.seekTo(0); yt.playVideo(); } }
        }
      });
    };
  }
  startEl.addEventListener('click', () => {
    started = true; t0 = performance.now();
    startEl.classList.add('hide');
    playMusic();
  });
  muteBtn.addEventListener('click', () => {
    if (musicOn) { pauseMusic(); muteBtn.classList.add('off'); }
    else { playMusic(); muteBtn.classList.remove('off'); }
  });
  cv.addEventListener('click', () => { if (started) t0 = performance.now(); });

  function frame(now) {
    const t = started ? (now - t0) / 1000 : 0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    /* estrellas */
    for (const s of STARS) {
      const a = (0.2 + 0.8 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph))) * clamp(t / 1.5) * 0.85;
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832); ctx.fill();
    }

    if (fn++ % skip === 0) {
      const s0 = performance.now();
      renderAscii(t);
      const dt = performance.now() - s0;
      skip = dt > 24 ? 4 : dt > 14 ? 3 : 2;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(asciiCv, 0, 0);

    /* partículas flotando */
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const mt = clamp((t - 5.5) / 2);
    if (mt > 0) {
      for (const m of MOTES) {
        const yy = ((m.y - t * m.v) % 1 + 1) % 1;
        const xx = m.x + Math.sin(t * 0.5 + m.ph) * 0.02;
        const a = (0.15 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.3 + m.ph))) * mt;
        ctx.fillStyle = 'hsla(' + m.hue + ',90%,80%,' + a.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(xx * W, yy * H, m.r, 0, 6.2832); ctx.fill();
      }
    }

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
